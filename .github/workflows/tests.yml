# The tests, on every push and pull request.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux, Python ${{ matrix.python }}
    # 24.04 named outright: the last Python 3.9 builds were made for it.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python the README promises, and the newest.
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: ./fff test

# The Mac tests are in tests-macos.yml. GitHub's Mac runners are often too
# busy to start a job at all, and a job that never started marked this
# workflow, and the README's badge, as failing.
